[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monarch-cli"
version = "0.1.0"
description = "Monarch Money CLI - forked from mmoney-cli with shared MCP auth"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "monarchmoneycommunity>=1.1.0",
    "click>=8.0.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
monarch = "mmoney_cli.cli:cli"
mmoney = "mmoney_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
